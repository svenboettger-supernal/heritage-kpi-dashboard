<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heritage · Accuracy KPI Framework</title>
  <link rel="icon" href="assets/heritage-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar topbar-sticky">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Heritage</h1>
        <div class="brand-sub">Accuracy KPI Framework</div>
      </div>
      <nav class="topnav" aria-label="Primary">
        <a href="#/" class="topnav-link" id="overview-link" hidden>Overview</a>

        <div class="section-pills" id="section-pills" role="tablist" aria-label="Overview sections" hidden>
          <button type="button" class="section-pill" data-scroll-to="section-accuracy"       role="tab">Accuracy</button>
          <button type="button" class="section-pill" data-scroll-to="section-accuracy-trend" role="tab">Accuracy trend</button>
          <button type="button" class="section-pill" data-scroll-to="section-timing"         role="tab">Timing</button>
          <button type="button" class="section-pill" data-scroll-to="section-timing-trend"   role="tab">Timing trend</button>
          <button type="button" class="section-pill" data-scroll-to="section-per-domain"     role="tab">Per domain</button>
        </div>

        <div class="dropdown" id="domains-dropdown">
          <button class="dropdown-toggle" type="button" aria-haspopup="menu" aria-expanded="false" data-nav="domains">
            Domains
            <svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M2 4 L5 7 L8 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="dropdown-menu" role="menu">
            <a href="#/domain/insurance-summary"        role="menuitem" data-domain="insurance-summary">Insurance summary</a>
            <a href="#/domain/flow-diagram"             role="menuitem" data-domain="flow-diagram">Flow Diagram</a>
            <a href="#/domain/asset-sheet"              role="menuitem" data-domain="asset-sheet">Asset Sheet</a>
            <a href="#/domain/data-sheet"               role="menuitem" data-domain="data-sheet">Data Sheet</a>
            <a href="#/domain/estate-distribution-chart" role="menuitem" data-domain="estate-distribution-chart">Estate Distribution</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="page">
    <div id="app"></div>

    <footer class="footer">
      <span>v1 demo · numbers are illustrative, anchored to current operational range</span>
      <a href="#/about">Framework legend</a>
    </footer>
  </main>

  <script src="seed-data.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
